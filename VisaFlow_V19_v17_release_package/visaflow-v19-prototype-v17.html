function drawerQuestionnaire(s){

  </aside>`;
};

renderPopover=function(){
  if(!state.popover)return "";

};

renderActionRow=function(a){const attrs=targetAttrs(a);return `<article class="release-row action" tabindex="0" ${a.route?`data-route="${a.route}"`:`data-open-submission="${a.submission}" data-drawer-tab="${a.tab}"${attrs}`}><span class="release-dot ${a.tone}"></span><div class="release-copy"><div class="release-title">${esc(a.title)}</div><div class="release-meta">${esc(a.context)}</div></div><div class="release-label">Срок<strong>${esc(a.due)}</strong></div>${v13StateLabel(a.badge,a.tone)}<div class="release-action"><button class="btn" ${a.route?`data-route="${a.route}"`:`data-open-submission="${a.submission}" data-drawer-tab="${a.tab}"${attrs}`}><span class="action-label">${esc(a.action)}</span>${icon("arrow","sm")}</button></div></article>`};

handleAction=function(action,el){
  if(action==="open-account"){state.dialog={type:"account"};renderApp();return}
  if(action==="open-agent-settings"){state.dialog=null;switchRoute("settings");return}
  if(action==="open-question-history"){state.dialog={type:"question-history"};renderApp();return}
  if(action==="open-create"){state.drawer={mode:"create",submissionId:null,tab:"overview",dirty:false,opener:el};state.create={step:0,type:"single",applicants:1,passportSelected:false,fileName:"",demoExtracted:false,commonAddress:null,commonStay:null};renderApp();return}
  if(action==="choose-passport"){document.querySelector("[data-passport-file]")?.click();return}
  if(action==="show-demo-extraction"){state.create.demoExtracted=true;state.drawer.dirty=true;toast("Демо-черновик подготовлен","Файл не читался; показан заранее подготовленный пример.","success");renderApp();return}
  if(action==="set-common-answer"){state.create[el.dataset.commonKey]=el.dataset.commonValue==="true";state.drawer.dirty=true;renderApp();return}
  if(action==="create-next"){if(!state.create.demoExtracted){toast("Сначала подготовьте данные паспорта","Выберите файл и откройте явный демо-результат.","danger");return}state.create.step=1;state.drawer.dirty=true;renderApp();return}
  if(action==="create-prev"){state.create.step=0;renderApp();return}
  if(action==="create-open-form-demo"){toast("Анкета откроется после backend-интеграции","В standalone HTML показан только согласованный переход.");return}
  return v12HandleAction(action,el);
};
document.addEventListener("change",e=>{if(e.target.matches("[data-passport-file]")){const file=e.target.files?.[0];state.create.passportSelected=!!file;state.create.fileName=file?.name||"";state.create.demoExtracted=false;state.drawer.dirty=true;renderApp()}},true);

<script>
/* VisaFlow V-19 v16 — explicit demo-role access and 1440px rail threshold */
document.title="VisaFlow V-19 v16 — release prototype";

function v16SetRole(target){
  if(!["agent","admin"].includes(target)) return;
  state.dialog=null;
  state.mobileSidebar=false;
  state.popover=null;
  state.search="";
  state.filters=[];
  state.drawer={mode:"closed",submissionId:null,tab:"overview",dirty:false,opener:null};
  state.settingsDirty=false;
  state.role=target;
  state.route=target==="admin"?"work":"submissions";
  state.tab=target==="admin"?"review":"requires_action";
  state.panelOpen=false;
  try{
    const url=new URL(location.href);
    if(target==="admin") url.searchParams.set("role","admin");
    else url.searchParams.delete("role");
    history.replaceState(null,"",url);
  }catch(_err){}
  renderApp();
  setTimeout(()=>document.querySelector('.nav-item.active')?.focus(),0);
}
toggleRole=function(){v16SetRole(state.role==="agent"?"admin":"agent")};

renderSidebar=function(){
  return `<aside class="sidebar ${state.mobileSidebar?"open":""}" aria-label="Основная навигация">
    <div class="brand"><div class="brand-mark">V</div><div class="brand-copy"><div class="brand-title">VisaFlow V-19</div><div class="brand-sub">Операции по Испании</div></div><button class="role-static role-access" data-action="open-account" aria-label="Открыть выбор рабочей роли" title="Рабочая роль"><span class="role-access-label">${roleLabel()}</span>${icon("arrow","sm")}</button></div>
    <button class="command" data-action="focus-search">${icon("search")}<span>Найти подачу</span><kbd>⌘ K</kbd></button>
    <div class="nav-label">Рабочая область</div>
    <nav class="nav">${navByRole[state.role].map(n=>`<button class="nav-item ${state.route===n.route?"active":""}" data-route="${n.route}" ${state.route===n.route?'aria-current="page"':""}>${icon(n.icon)}<span>${n.label}</span>${n.count?`<span class="count">${n.count}</span>`:""}</button>`).join("")}</nav>
    <div class="sidebar-bottom"><button class="user-menu" data-action="open-account"><span class="avatar">${state.role==="agent"?"ТН":"ИЛ"}</span><span class="user-copy"><span class="user-name">${state.role==="agent"?"Татьяна Новикова":"Ирина Лебедева"}</span><span class="user-org">${roleLabel()} · VisaFlow Operations</span></span>${icon("more","sm")}</button></div>
  </aside>`;
};

const v16PreviousRenderDialog=renderDialog;
renderDialog=function(){
  if(state.dialog?.type==="account")return `<div class="dialog-backdrop"><div class="dialog account-dialog" role="dialog" aria-modal="true" aria-labelledby="account-title"><h2 id="account-title">Рабочий профиль</h2><div class="account-row"><span class="avatar">${state.role==="agent"?"ТН":"ИЛ"}</span><div><strong>${state.role==="agent"?"Татьяна Новикова":"Ирина Лебедева"}</strong><span>${roleLabel()} · VisaFlow Operations</span></div></div><div class="account-role-block"><div class="account-role-label">Режим прототипа</div><div class="account-role-switch" role="group" aria-label="Выбрать рабочую роль"><button class="account-role-option ${state.role==="agent"?"selected":""}" data-action="set-demo-role" data-role="agent" aria-pressed="${state.role==="agent"}"><strong>Агент</strong><span>Входящие, действия и подачи</span></button><button class="account-role-option ${state.role==="admin"?"selected":""}" data-action="set-demo-role" data-role="admin" aria-pressed="${state.role==="admin"}"><strong>Администратор</strong><span>Работа и выгрузка</span></button></div><p class="account-trust-note">Переключение меняет только демонстрационный интерфейс. Авторизация и права backend здесь не моделируются.</p></div><div class="dialog-actions"><button class="btn" data-action="cancel-dialog">Закрыть</button>${state.role==="agent"?`<button class="btn" data-action="open-agent-settings">Настройки</button>`:""}</div></div></div>`;
  return v16PreviousRenderDialog();
};

const v16PreviousHandleAction=handleAction;
handleAction=function(action,el){
  if(action==="set-demo-role"){v16SetRole(el.dataset.role);return}
  return v16PreviousHandleAction(action,el);
};

switchRoute=function(route){
  if(!routeAllowed(route))return;
  state.route=route;state.search="";state.filters=[];state.popover=null;state.mobileSidebar=false;state.uiState="populated";
  state.tab=route==="inbox"?"unread":route==="actions"?"open":route==="submissions"?"requires_action":route==="work"?"review":route==="export"?"ready":state.tab;
  state.panelOpen=innerWidth>=1440&&["submissions","export"].includes(route);
  renderApp();
};

renderApp=function(){
  if(!routeAllowed(state.route)){state.route=state.role==="agent"?"submissions":"work";state.tab=state.role==="agent"?"requires_action":"review"}
  const context=renderContextPanel();document.body.dataset.role=state.role;
  $("#app").innerHTML=`<div class="app-wrap"><div class="app-frame ${context?"with-context":""}">${state.mobileSidebar?`<div class="sidebar-backdrop" data-action="mobile-menu"></div>`:""}${renderSidebar()}<main class="main">${renderTopbar()}<div class="page"><div class="page-inner">${renderScreen()}</div></div></main>${innerWidth<1440&&context?`<div class="panel-backdrop" data-action="toggle-panel"></div>`:""}${context}</div></div>`;
  $("#portal").innerHTML=renderDrawer()+renderDialog();
  if(state.drawer.mode!=="closed")setTimeout(focusDrawer,0);
};

renderApp();
</script>

function v17SaveRailPref(route,value){
  if(!["submissions","export"].includes(route))return;
  try{const p=v17RailPrefs();p[route]=!!value;sessionStorage.setItem(V17_RAIL_PREF_KEY,JSON.stringify(p))}catch(_){}
}
function v17IsDocked(){return state.panelOpen&&innerWidth>=V17_RAIL_DOCK_MIN&&["submissions","export"].includes(state.route)}
function v17TargetAttrsFromIssue(i){const r=i?.targetRef||{};return targetAttrs({section:r.section,field:r.field,applicant:r.applicant,issue:i?.id})}
function v17IssueTone(i){return i?.severity==="blocker"||i?.status==="open"?"danger":"warning"}
function v17IssueActionLabel(i){if(i?.targetRef?.tab==="questionnaire")return "Открыть точное поле";if(i?.targetRef?.tab==="files")return "Открыть файл";return "Открыть замечание"}

renderSidebar=function(){
  return `<aside class="sidebar ${state.mobileSidebar?"open":""}" aria-label="Основная навигация">
    <div class="brand"><span class="brand-logo-wrap" aria-hidden="true"><img class="brand-logo" src="${V17_LOGO_SRC}" alt=""></span><div class="brand-copy"><div class="brand-title">VisaFlow V-19</div><div class="brand-sub">Операции по Испании</div></div><button class="role-static role-access" data-action="open-account" aria-label="Открыть выбор рабочей роли" title="Рабочая роль"><span class="role-access-label">${roleLabel()}</span>${icon("arrow","sm")}</button></div>
    <button class="command" data-action="focus-search">${icon("search")}<span>Найти подачу</span><kbd>⌘ K</kbd></button>
    <div class="nav-label">Рабочая область</div>
    <nav class="nav">${navByRole[state.role].map(n=>`<button class="nav-item ${state.route===n.route?"active":""}" data-route="${n.route}" ${state.route===n.route?'aria-current="page"':""}>${icon(n.icon)}<span>${n.label}</span>${n.count?`<span class="count">${n.count}</span>`:""}</button>`).join("")}</nav>
    <div class="sidebar-bottom"><button class="user-menu" data-action="open-account"><span class="avatar">${state.role==="agent"?"ТН":"ИЛ"}</span><span class="user-copy"><span class="user-name">${state.role==="agent"?"Татьяна Новикова":"Ирина Лебедева"}</span><span class="user-org">${roleLabel()} · VisaFlow Operations</span></span>${icon("more","sm")}</button></div>
  </aside>`;
};

function v17CompactSubmissionRow(s){
  const tone=STATUS[s.status].tone,f=v15FileParts(s),detail=[s.blockers?`${s.blockers} блокер`:s.updated,f.primary].filter(Boolean).join(" · ");
  return `<article class="submission-release-row ${state.selectedId===s.id?"selected":""}" tabindex="0" data-open-submission="${s.id}" data-drawer-tab="${STATUS[s.status].tab}"><div class="submission-main"><span class="submission-person ${tone}">${icon(s.type==="family"?"users":"user")}</span><div class="release-copy"><div class="submission-title">${esc(s.title)}</div><div class="submission-meta">${esc(s.id)} · ${s.type==="family"?`${s.applicants} заявителя`:"1 заявитель"}</div></div></div><div class="submission-trip"><strong>${esc(s.city)}</strong><span>${esc(s.trip)}</span></div><div class="submission-status-cell">${v15StatusTag(s)}<small>${esc(detail)}</small></div><div class="submission-progress">${s.completeness}%</div><div class="submission-chevron">${icon("arrow")}</div></article>`;
}
renderSubmissions=function(){
  const data=applyCommonFilters(submissions.filter(tabMatchesSubmission)).filter(s=>matchesSearch(s.title,s.id,s.city)),override=stateOverride(),compact=v17IsDocked();
  const body=override||(data.length?compact?`<div class="submission-table v17-submission-compact"><div class="submission-head"><span>Подача</span><span>Поездка</span><span>Статус</span><span>Готово</span><span></span></div>${data.map(v17CompactSubmissionRow).join("")}</div>`:`<div class="submission-table"><div class="submission-head"><span>Подача</span><span>Поездка</span><span>Статус</span><span>Файлы</span><span>Готово</span><span></span></div>${data.map(renderSubmissionRow).join("")}</div>`:`<div class="state-box"><div class="state-content"><div class="state-icon">${icon(state.search?"search":"file","lg")}</div><h2>${state.search?"Ничего не найдено":"В этой категории нет подач"}</h2><p>${state.search?"Измените запрос или сбросьте фильтры.":"Откройте общий список, чтобы увидеть остальные подачи."}</p><button class="btn" data-action="reset-list">${state.search?"Сбросить фильтры":"Показать все"}</button></div></div>`);
  return `<div class="page-grid">${renderToolbar(submissionTabs(),"Имя, ID или заявитель",{panel:true})}${body}</div>`;
};

function v17SubmissionRail(){
  const s=getSub(state.selectedId),all=issueList(s.id).filter(i=>i.status!=="closed"),primary=all.find(i=>i.status==="open"&&i.severity==="blocker")||all[0],tone=STATUS[s.status].tone;
  const primaryTab=primary?.targetRef?.tab||STATUS[s.status].tab,attrs=primary?v17TargetAttrsFromIssue(primary):"";
  return `<aside class="context-panel v17-context-rail" aria-label="Контекст выбранной подачи"><div class="context-head"><div class="v17-context-heading"><span class="v17-context-eyebrow">Контекст подачи</span><h2>${esc(s.title)}</h2></div><button class="icon-btn context-close" data-action="toggle-panel" aria-label="Скрыть контекст">${icon("x")}</button></div><div class="v17-rail-body">
    <section class="v17-rail-card primary"><div class="v17-rail-meta mono">${esc(s.id)} · ${esc(s.city)}</div><div class="v17-rail-statusline"><span class="entity-tag ${tone}">${esc(STATUS[s.status].label)}</span><span class="v17-rail-readiness">${s.completeness}%</span></div><div class="progress v17-rail-progress"><span style="width:${s.completeness}%"></span></div><div class="v17-rail-meta">${s.type==="family"?`${s.applicants} заявителя`:"1 заявитель"} · ${esc(s.trip)} · ${esc(s.files)}</div></section>
    <section class="v17-rail-card"><div class="v17-rail-label">Следующее действие</div><div class="v17-rail-title">${esc(primary?.title||nextAction(s))}</div><p class="v17-rail-action-copy">${esc(primary?.comment||(s.blockers?"Откройте точное замечание и исправьте связанное поле или файл.":"Откройте подачу и проверьте текущее состояние."))}</p><button class="btn primary v17-rail-action" data-open-submission="${s.id}" data-drawer-tab="${primaryTab}"${attrs}>${esc(primary?v17IssueActionLabel(primary):nextAction(s))}${icon("arrow","sm")}</button></section>
    <section class="v17-rail-card"><div class="v17-rail-label">Открытые замечания · ${all.length}</div>${all.length?`<div class="v17-rail-list">${all.slice(0,4).map(i=>`<button class="v17-rail-issue" data-open-submission="${s.id}" data-drawer-tab="${i.targetRef?.tab||"issues"}"${v17TargetAttrsFromIssue(i)}><span class="v17-rail-issue-dot ${v17IssueTone(i)}"></span><span><strong>${esc(i.title)}</strong><small>${esc(i.target)}</small></span>${icon("arrow","sm")}</button>`).join("")}</div>`:`<div class="v17-rail-empty">Блокирующих замечаний нет.</div>`}</section>
    <section class="v17-rail-card"><div class="v17-rail-label">Быстрые переходы</div><div class="v17-rail-links"><button class="v17-rail-link" data-open-submission="${s.id}" data-drawer-tab="questionnaire">${icon("edit","sm")}Анкета</button><button class="v17-rail-link" data-open-submission="${s.id}" data-drawer-tab="files">${icon("file","sm")}Файлы</button><button class="v17-rail-link" data-open-submission="${s.id}" data-drawer-tab="issues">${icon("alert","sm")}Замечания</button></div></section>
    <section class="v17-rail-card"><div class="v17-rail-label">Последние изменения</div><div class="v17-rail-timeline"><div class="v17-rail-event"><span class="v17-rail-event-dot"></span><span><strong>${esc(STATUS[s.status].label)}</strong><span>${esc(s.updated)} · ${esc(s.reviewer)}</span></span></div><div class="v17-rail-event"><span class="v17-rail-event-dot"></span><span><strong>Анкета обновлена</strong><span>вчера · ${esc(s.owner)}</span></span></div></div></section>
  </div></aside>`;
}

renderExportPanel=function(){
  const g=exportGuard(),list=selectedExportSubs(),applicants=list.reduce((a,s)=>a+s.applicants,0),stats=g.mappingStats,unresolved=stats.unresolved;
  return `<aside class="context-panel v17-context-rail" aria-label="Контекст выгрузки"><div class="context-head"><div class="v17-context-heading"><span class="v17-context-eyebrow">Контракт выгрузки</span><h2>Excel · Sheet1 A:BD</h2></div><button class="icon-btn context-close" data-action="toggle-panel" aria-label="Скрыть контекст">${icon("x")}</button></div><div class="v17-rail-body">
    <section class="v17-rail-card primary"><div class="v17-rail-label">Текущий пакет</div><div class="v17-rail-title">${list.length?`${list.length} подач · ${applicants} заявителей`:"Ничего не выбрано"}</div><div class="v17-export-summary"><div class="v17-export-stat"><strong>${stats.mapped}</strong><span>mapped</span></div><div class="v17-export-stat"><strong>${unresolved.length}</strong><span>unresolved</span></div></div></section>
    <section class="v17-rail-card">${renderSheetPreview()}</section>
    <section class="v17-rail-card"><div class="v17-rail-label">Pre-export checks</div><div class="guard-list">${guardRow(g.hasSelection,"Есть выбранные подачи")}${guardRow(g.ready,"Только принятые подачи")}${guardRow(g.blockers,"Нет открытых блокеров")}${guardRow(g.files,"Обязательные файлы готовы")}${guardRow(g.compatible,"Совместимый пакет",g.compatible?(g.hasSelection?`${[...g.cities][0]||"—"} · ${[...g.trips][0]||"—"}`:"Выберите строки"):"Нельзя смешивать города, даты или категории")}${guardRow(g.mapping,"Все 56 колонок подтверждены",g.mapping?"Контракт закрыт":`${unresolved.length} колонки требуют решения`)}</div></section>
    <section class="v17-rail-card">${renderMappingAudit()}</section>
    <div class="v17-blocker-callout">${icon("alert","sm")}<span><strong>Выгрузка заблокирована fail-closed</strong><span>${unresolved.length?`${unresolved.length} mapping-пункта не подтверждены. `:""}Duplicate protection требует backend evidence.</span></span></div>
    <section class="v17-rail-card"><div class="context-actions"><button class="btn primary" data-action="export-preflight" disabled>${icon("checks")}Проверить пакет</button><button class="btn" disabled>${icon("download")}Скачать Excel</button></div><div class="sheet-caption">Standalone HTML не создаёт и не скачивает файл.</div></section>
  </div></aside>`;
};

const v17PreviousContextPanel=renderContextPanel;
renderContextPanel=function(){
  if(!state.panelOpen)return "";
  if(state.route==="submissions")return v17SubmissionRail();
  if(state.route==="export")return renderExportPanel();
  return v17PreviousContextPanel();
};

/* Compact, structured issue cards */
drawerIssues=function(s){
  const list=issueList(s.id);
  if(!list.length)return `<div class="state-box"><div class="state-content"><div class="state-icon">${icon("check","lg")}</div><h2>Открытых замечаний нет</h2><p>Подача не содержит зафиксированных проблем.</p></div></div>`;
  return `<div class="issue-list v17-issue-list">${list.map(i=>{const ref=i.targetRef||{},isQuestion=ref.tab==="questionnaire",isFile=ref.tab==="files";return `<article class="issue-card v17-issue-card ${i.status}" data-issue-card="${i.id}"><div class="v17-issue-top"><div class="v17-issue-heading"><div class="issue-title">${esc(i.title)}</div><div class="issue-target">${esc(i.target)}</div></div>${issueStatusBadge(i)}</div><div class="v17-issue-details"><div class="v17-issue-detail"><span>Причина</span><p>${esc(i.reason)}</p></div><div class="v17-issue-detail"><span>Комментарий</span><p>${esc(i.comment)}</p></div></div>${i.before&&i.after?`<div class="issue-diff v17-issue-diff"><div><span>До</span><strong>${esc(i.before)}</strong></div><div class="diff-arrow">${icon("arrow","sm")}</div><div><span>После</span><strong>${esc(i.after)}</strong></div></div>`:""}<div class="v17-issue-footer"><span class="badge ${i.severity==="blocker"?"danger":"warning"}">${i.severity==="blocker"?"Блокер":"Предупреждение"}</span>${isQuestion&&i.status!=="closed"?`<button class="btn small" data-open-issue-target="${i.id}">${i.status==="open"?"Открыть точное поле":"Проверить изменение"}</button>`:""}${isFile&&i.status!=="closed"?`<button class="btn small" data-drawer-tab="files" data-action="drawer-tab">Открыть файл</button>`:""}${state.role==="admin"&&i.status==="fixed"?`<button class="btn small" data-issue-action="close" data-issue-id="${i.id}">Закрыть замечание</button>`:""}${i.status==="closed"?`<button class="btn ghost small" disabled>Завершено</button>`:""}${isFile&&state.role==="agent"?`<span class="v17-issue-note">Реальная загрузка недоступна в прототипе</span>`:""}</div></article>`}).join("")}</div>`;
};

/* File matrix: one trust note, no repeated system copy */
drawerFiles=function(s){
  const fileIssue=issueList(s.id).find(i=>i.targetRef?.tab==="files"),videoState=fileIssue?.status==="fixed"?{label:"Ожидает проверки",tone:"warning"}:fileIssue?.status==="open"?{label:"Заменить",tone:"danger"}:{label:"Готово",tone:"success"};
  const files=[
    {name:"Фото на анкету",detail:"Обязательный файл",owner:s.type==="family"?"Анна Петрова":s.title,state:{label:"Готово",tone:"success"}},
    {name:"Скан паспорта",detail:"Разворот с персональными данными",owner:s.type==="family"?"Анна Петрова":s.title,state:{label:"Готово",tone:"success"}},
    {name:"Селфи с паспортом",detail:"Проверка владельца документа",owner:s.type==="family"?"Анна Петрова":s.title,state:s.id==="SUB-1084"?{label:"Ожидает проверки",tone:"warning"}:{label:"Готово",tone:"success"}},
    {name:"Видео с паспортом",detail:"Проверка документа в кадре",owner:s.type==="family"?"Пётр Петров":s.title,state:videoState}
  ];
  return `<div class="file-matrix v17-file-matrix"><div class="file-matrix-head"><span>Файл</span><span>Владелец</span><span style="text-align:right">Состояние</span></div>${files.map(f=>`<div class="file-matrix-row"><div class="file-description"><strong>${esc(f.name)}</strong><span>${esc(f.detail)}</span></div><div class="file-owner"><span>${esc(f.owner)}</span></div><div class="file-state-actions"><span class="entity-tag ${f.state.tone}">${esc(f.state.label)}</span>${f.state.tone==="danger"?`<button class="btn small" disabled title="Upload не реализован">Заменить</button>`:f.state.tone==="warning"?`<button class="btn small" data-drawer-tab="issues" data-action="drawer-tab">К замечанию</button>`:""}</div></div>`).join("")}</div><div class="surface v17-file-trust"><div class="guard warn"><span class="guard-icon">${icon("info","sm")}</span><span><strong>Файлы не отправляются</strong><br><span class="subtle">Показаны только состояния интерфейса; upload и чтение файлов отключены.</span></span></div></div>`;
};

drawerApplicants=function(s){
  const list=applicantData[s.id]||Array.from({length:s.applicants},(_,i)=>({name:s.type==="family"?`Заявитель ${i+1}`:s.title,role:i===0?"Основной заявитель":"Член семьи",questionnaire:s.completeness,files:s.files,issues:i===0?s.blockers:0,passport:`•••• ${614+i*6}`}));
  return `<div class="applicant-matrix v17-applicant-matrix"><div class="applicant-matrix-head"><span>Заявитель</span><span>Готовность</span><span style="text-align:right">Состояние</span></div>${list.map(a=>`<div class="applicant-matrix-row"><div class="applicant-identity"><strong>${esc(a.name)}</strong><span>${esc(a.role)} · паспорт ${esc(a.passport)}</span></div><div class="applicant-readiness"><div class="readiness-top"><span>Анкета ${a.questionnaire}%</span><span class="file-mini ${v15ApplicantFileTone(a.files)}">Файлы ${esc(a.files)}</span></div><div class="progress"><span style="width:${a.questionnaire}%"></span></div></div><div class="applicant-result">${a.issues?`<span class="entity-tag danger">${a.issues} замечание</span>`:`<span class="entity-tag success">Готово</span>`}</div></div>`).join("")}</div>`;
};

/* Rail state, layout and responsive overlay */
const v17PreviousHandleAction=handleAction;
handleAction=function(action,el){
  if(action==="toggle-panel"){
    state.panelOpen=!state.panelOpen;state.popover=null;
    if(innerWidth>=V17_RAIL_DOCK_MIN)v17SaveRailPref(state.route,state.panelOpen);
    renderApp();return;
  }
  return v17PreviousHandleAction(action,el);
};

switchRoute=function(route){
  if(!routeAllowed(route))return;
  state.route=route;state.search="";state.filters=[];state.popover=null;state.mobileSidebar=false;state.uiState="populated";
  state.tab=route==="inbox"?"unread":route==="actions"?"open":route==="submissions"?"requires_action":route==="work"?"review":route==="export"?"ready":state.tab;
  state.panelOpen=["submissions","export"].includes(route)&&innerWidth>=V17_RAIL_DOCK_MIN&&v17RailPref(route);
  renderApp();
};

const v17PreviousSetRole=v16SetRole;
v16SetRole=function(target){
  v17PreviousSetRole(target);
  if(target==="agent"&&state.route==="submissions"&&innerWidth>=V17_RAIL_DOCK_MIN){state.panelOpen=v17RailPref("submissions");renderApp()}
  if(target==="admin"&&state.route==="work")state.panelOpen=false;
};
toggleRole=function(){v16SetRole(state.role==="agent"?"admin":"agent")};

renderApp=function(){
  if(!routeAllowed(state.route)){state.route=state.role==="agent"?"submissions":"work";state.tab=state.role==="agent"?"requires_action":"review"}
  const context=renderContextPanel(),docked=!!context&&innerWidth>=V17_RAIL_DOCK_MIN&&["submissions","export"].includes(state.route);document.body.dataset.role=state.role;
  $("#app").innerHTML=`<div class="app-wrap"><div class="app-frame ${context?"with-context":""} ${docked?"v17-rail-docked":""}">${state.mobileSidebar?`<div class="sidebar-backdrop" data-action="mobile-menu"></div>`:""}${renderSidebar()}<main class="main">${renderTopbar()}<div class="page"><div class="page-inner">${renderScreen()}</div></div></main>${context&&!docked?`<div class="panel-backdrop" data-action="toggle-panel"></div>`:""}${context}</div></div>`;
  $("#portal").innerHTML=renderDrawer()+renderDialog();
  const panelButton=[...document.querySelectorAll('[data-action="toggle-panel"]')].find(x=>!x.classList.contains("context-close"));if(panelButton){panelButton.setAttribute("aria-label",state.panelOpen?"Скрыть контекст":"Показать контекст");panelButton.title=state.panelOpen?"Скрыть контекст":"Показать контекст"}
  if(state.drawer.mode!=="closed")setTimeout(()=>{focusDrawer();focusQuestionTarget()},0);
};

/* Default to visible docked rails on desktop. */
if(["submissions","export"].includes(state.route)&&innerWidth>=V17_RAIL_DOCK_MIN)state.panelOpen=v17RailPref(state.route);
let v17ResizeTimer=0;
window.addEventListener("resize",()=>{clearTimeout(v17ResizeTimer);v17ResizeTimer=setTimeout(()=>{const should=["submissions","export"].includes(state.route)&&innerWidth>=V17_RAIL_DOCK_MIN&&v17RailPref(state.route);if(state.panelOpen!==should){state.panelOpen=should;renderApp()}},80)});
renderApp();
</script>


<style>
/* v17 export fit correction */
.context-panel.v17-context-rail{overflow-x:hidden}
.v17-rail-body,.v17-rail-card,.v17-export-summary,.v17-export-stat,.v17-context-rail .sheet-preview,.v17-context-rail .sheet-scroll,.v17-context-rail .mapping-audit{min-width:0;max-width:100%}
.v17-context-rail .sheet-scroll{overflow:hidden}
.app-frame.v17-rail-docked .bulk-bar .btn{display:none}
.app-frame.v17-rail-docked .bulk-bar{min-height:50px}
.app-frame.v17-rail-docked .bulk-status{margin-left:auto;margin-right:0;max-width:58%;text-align:right}
</style>
<script>
renderExportTable=function(){
  const data=submissions.filter(s=>s.status==="ready_for_export").filter(s=>matchesSearch(s.title,s.id,s.city)),compact=v17IsDocked();
  return `<div class="table-wrap"><table class="data-table"><thead><tr><th style="width:42px"><input class="checkbox" type="checkbox" aria-label="Выбрать все совместимые" data-action="select-all-export" ${data.every(s=>state.selectedExport.has(s.id))?"checked":""}></th><th>Подача</th><th>Город</th><th>Даты</th><th>Заявители</th><th>Состояние</th><th>Обновлено</th></tr></thead><tbody>${data.map(s=>`<tr class="${state.selectedExport.has(s.id)?"selected":""}" data-open-submission="${s.id}" data-drawer-tab="overview"><td><input class="checkbox" type="checkbox" aria-label="Выбрать ${esc(s.title)}" data-export-select="${s.id}" ${state.selectedExport.has(s.id)?"checked":""}></td><td><div class="cell-title">${esc(s.title)}</div><div class="subtle mono">${s.id}</div></td><td>${esc(s.city)}</td><td>${esc(s.trip)}</td><td>${s.applicants}</td><td>${compact?`<span class="badge success">Готово</span>`:statusBadge(s.status)}</td><td>${esc(s.updated)}</td></tr>`).join("")}</tbody></table></div>`;
};
renderApp();
</script>

</body>
