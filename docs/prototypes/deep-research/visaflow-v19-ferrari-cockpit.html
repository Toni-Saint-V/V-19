<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VisaFlow AI - V-19 operations cockpit</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f3ee;
        --rail: #ebe8df;
        --surface: #fffefa;
        --surface-2: #f7f5ef;
        --surface-3: #eeebe3;
        --text: #15171c;
        --text-2: #414853;
        --muted: #69717e;
        --faint: #9097a2;
        --line: rgba(24, 28, 35, 0.11);
        --line-strong: rgba(24, 28, 35, 0.18);
        --amber: #f0a52b;
        --amber-soft: rgba(240, 165, 43, 0.13);
        --blue: #5a9ce6;
        --blue-soft: rgba(90, 156, 230, 0.13);
        --teal: #22b8a6;
        --teal-soft: rgba(34, 184, 166, 0.13);
        --red: #f1635f;
        --red-soft: rgba(241, 99, 95, 0.13);
        --shadow: 0 28px 70px rgba(19, 22, 29, 0.1);
        --radius: 12px;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
      }

      body.dark {
        color-scheme: dark;
        --bg: #050608;
        --rail: #080b0f;
        --surface: #10141a;
        --surface-2: #151a21;
        --surface-3: #1b2028;
        --text: #f3eee7;
        --text-2: #c8cbd2;
        --muted: #8b929d;
        --faint: #68717e;
        --line: rgba(255, 255, 255, 0.075);
        --line-strong: rgba(255, 255, 255, 0.15);
        --shadow: 0 28px 74px rgba(0, 0, 0, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        margin: 0;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid rgba(240, 165, 43, 0.72);
        outline-offset: 3px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .rail {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 18px 10px;
        border-right: 1px solid var(--line);
        background: var(--rail);
      }

      .logo,
      .rail-btn {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 13px;
        display: grid;
        place-items: center;
      }

      .logo {
        color: #fff1ce;
        border-color: rgba(240, 165, 43, 0.28);
        background: rgba(240, 165, 43, 0.18);
        font-weight: 760;
      }

      .rail-btn {
        position: relative;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        transition:
          color 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .rail-btn:hover,
      .rail-btn.active {
        color: var(--amber);
        border-color: rgba(240, 165, 43, 0.34);
        background: var(--amber-soft);
      }

      .rail-btn.active::before {
        position: absolute;
        left: -11px;
        width: 3px;
        height: 20px;
        border-radius: 999px;
        background: var(--amber);
        content: "";
      }

      .rail-spacer {
        height: 36px;
      }

      .rail-sep {
        width: 40px;
        height: 1px;
        margin-top: auto;
        background: var(--line);
      }

      .icon {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .page {
        min-width: 0;
        padding: 28px 36px 44px;
      }

      .page-head {
        min-height: 90px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: start;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        font-size: 31px;
        line-height: 1.05;
        font-weight: 760;
      }

      .brand {
        padding-top: 7px;
        font-size: 16px;
        font-weight: 760;
      }

      .pills,
      .row-tags,
      .drawer-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pills {
        margin-top: 14px;
      }

      .pill,
      .chip,
      .tag,
      .btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: var(--text-2);
        background: var(--surface);
        font-weight: 700;
        white-space: nowrap;
      }

      .pill,
      .chip,
      .btn {
        min-height: 34px;
        padding: 8px 12px;
        font-size: 13px;
      }

      .pill strong {
        color: var(--text);
        font-size: 14px;
      }

      .tag {
        min-height: 24px;
        padding: 4px 9px;
        font-size: 12px;
      }

      .amber {
        color: var(--amber);
        border-color: rgba(240, 165, 43, 0.28);
        background: var(--amber-soft);
      }

      .blue {
        color: var(--blue);
        border-color: rgba(90, 156, 230, 0.28);
        background: var(--blue-soft);
      }

      .teal {
        color: var(--teal);
        border-color: rgba(34, 184, 166, 0.28);
        background: var(--teal-soft);
      }

      .red {
        color: var(--red);
        border-color: rgba(241, 99, 95, 0.28);
        background: var(--red-soft);
      }

      .toolbar {
        min-height: 70px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: end;
      }

      .tabs {
        display: flex;
        gap: 22px;
        min-width: 0;
        overflow-x: auto;
      }

      .tab {
        position: relative;
        min-height: 38px;
        padding: 0 0 12px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
      }

      .tab.active {
        color: var(--text);
      }

      .tab.active::after {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        border-radius: 999px;
        background: var(--amber);
        content: "";
      }

      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .search {
        width: min(300px, 30vw);
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        color: var(--muted);
        background: var(--surface);
      }

      .search input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        color: var(--text);
        background: transparent;
      }

      .workbench {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        gap: 18px;
        align-items: start;
      }

      .surface {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .surface-head {
        min-height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }

      .surface-head h2,
      .focus-panel h2 {
        font-size: 18px;
        line-height: 1.15;
        font-weight: 760;
      }

      .muted,
      .surface-head p,
      .row-meta,
      .hint {
        color: var(--muted);
      }

      .queue {
        display: grid;
      }

      .queue-head,
      .queue-row {
        display: grid;
        grid-template-columns: 72px minmax(210px, 1.4fr) minmax(180px, 1fr) 150px 116px;
        gap: 14px;
        align-items: center;
        padding: 0 18px;
      }

      .queue-head {
        min-height: 42px;
        color: var(--faint);
        background: var(--surface-2);
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        font-weight: 760;
        text-transform: uppercase;
      }

      .queue-row {
        min-height: 74px;
        width: 100%;
        color: var(--text);
        background: transparent;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        text-align: left;
        transition:
          background 150ms ease,
          box-shadow 150ms ease;
      }

      .queue-row:last-child {
        border-bottom: 0;
      }

      .queue-row:hover,
      .queue-row.active {
        background: var(--surface-2);
      }

      .queue-row.active {
        box-shadow: inset 3px 0 0 var(--amber);
      }

      .rank {
        color: var(--text);
        font-size: 19px;
        font-weight: 760;
      }

      .row-title {
        display: block;
        font-weight: 760;
        line-height: 1.25;
      }

      .row-meta {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        line-height: 1.35;
      }

      .next-action {
        display: block;
        font-weight: 720;
      }

      .reason {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .readiness {
        display: grid;
        gap: 7px;
      }

      .meter {
        height: 6px;
        border-radius: 999px;
        background: var(--surface-3);
        overflow: hidden;
      }

      .meter span {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--amber), var(--teal));
      }

      .row-cta,
      .open-btn {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text-2);
        background: var(--surface);
        font-size: 13px;
        font-weight: 730;
      }

      .focus-panel {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .focus-head {
        padding: 17px 16px 14px;
        border-bottom: 1px solid var(--line);
      }

      .focus-head p {
        margin-top: 6px;
        color: var(--muted);
        line-height: 1.4;
      }

      .focus-action {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-2);
      }

      .focus-action strong {
        display: block;
        font-size: 17px;
        line-height: 1.25;
      }

      .focus-list {
        display: grid;
        gap: 0;
      }

      .focus-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--line);
      }

      .focus-item:last-child {
        border-bottom: 0;
      }

      .focus-dot {
        width: 8px;
        height: 8px;
        margin-top: 7px;
        border-radius: 999px;
        background: var(--amber);
      }

      .focus-dot.red {
        background: var(--red);
      }

      .focus-dot.teal {
        background: var(--teal);
      }

      .focus-item strong {
        display: block;
        font-size: 13px;
        line-height: 1.35;
      }

      .focus-item span span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        line-height: 1.35;
      }

      .focus-footer {
        display: grid;
        gap: 9px;
        padding: 14px 16px 16px;
      }

      .primary {
        color: #171004;
        border-color: rgba(240, 165, 43, 0.28);
        background: var(--amber);
      }

      .ghost {
        background: transparent;
      }

      .trust {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .scrim {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        background: rgba(0, 0, 0, 0);
        transition: background 200ms ease;
      }

      .scrim.show {
        pointer-events: auto;
        background: rgba(0, 0, 0, 0.36);
      }

      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 60;
        width: min(820px, calc(100vw - 72px));
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        border-left: 1px solid var(--line-strong);
        background: var(--surface);
        box-shadow: -30px 0 80px rgba(0, 0, 0, 0.26);
        transform: translateX(104%);
        transition: transform 210ms ease;
      }

      .drawer.open {
        transform: translateX(0);
      }

      .drawer-head {
        min-height: 108px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: start;
        padding: 27px 30px 15px;
        border-bottom: 1px solid var(--line);
      }

      .drawer-head h2 {
        font-size: 27px;
        line-height: 1.08;
        font-weight: 760;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text-2);
        background: transparent;
        cursor: pointer;
      }

      .drawer-tabs {
        display: flex;
        gap: 24px;
        padding: 0 30px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
      }

      .drawer-body {
        min-height: 0;
        overflow: auto;
        padding: 22px 30px;
      }

      .drawer-body > * + * {
        margin-top: 14px;
      }

      .drawer-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .drawer-card {
        min-height: 122px;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 15px;
        background: var(--surface);
      }

      .drawer-card h3 {
        color: var(--muted);
        font-size: 11px;
        font-weight: 760;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .drawer-card strong {
        display: block;
        margin-top: 12px;
        font-size: 20px;
        line-height: 1.1;
        font-weight: 760;
      }

      .checklist {
        border: 1px solid var(--line);
        border-radius: 14px;
        display: grid;
        overflow: hidden;
        background: var(--surface);
      }

      .check-row {
        min-height: 62px;
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }

      .check-row:last-child {
        border-bottom: 0;
      }

      .check-row strong,
      .check-row .muted {
        display: block;
      }

      .check-row strong {
        font-size: 15px;
      }

      .check-row .muted {
        margin-top: 3px;
      }

      .drawer-foot {
        min-height: 70px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 14px 30px;
        border-top: 1px solid var(--line);
      }

      .export-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 18px;
      }

      .export-row {
        min-height: 58px;
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1.2fr) auto;
        gap: 12px;
        align-items: center;
        padding: 11px 18px;
        border-bottom: 1px solid var(--line);
      }

      .export-row:last-child {
        border-bottom: 0;
      }

      @media (max-width: 1180px) {
        .workbench,
        .export-grid {
          grid-template-columns: 1fr;
        }

        .focus-panel {
          display: none;
        }
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
        }

        .rail {
          position: relative;
          width: 100%;
          max-width: 100vw;
          height: auto;
          flex-direction: row;
          justify-content: flex-start;
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .rail-spacer,
        .rail-sep {
          display: none;
        }

        .rail-btn,
        .logo {
          flex: 0 0 auto;
        }

        .rail-btn.active::before {
          left: 50%;
          bottom: -12px;
          width: 18px;
          height: 3px;
          transform: translateX(-50%);
        }

        .page {
          padding: 22px 14px 32px;
        }

        .page-head,
        .toolbar {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 30px;
        }

        .brand {
          display: none;
        }

        .tabs {
          flex-wrap: wrap;
          gap: 10px 18px;
          overflow-x: visible;
        }

        .tab {
          min-height: 30px;
          padding-bottom: 9px;
          font-size: 13px;
        }

        .toolbar {
          min-height: auto;
          gap: 12px;
          padding: 16px 0 10px;
        }

        .tools {
          display: grid;
          grid-template-columns: 1fr auto;
        }

        .search {
          width: 100%;
        }

        .queue-head {
          display: none;
        }

        .queue-row {
          min-height: 132px;
          grid-template-columns: 34px minmax(0, 1fr) auto;
          gap: 10px;
          padding: 14px;
        }

        .queue-row > span:nth-child(3),
        .queue-row > span:nth-child(4) {
          grid-column: 2 / 4;
        }

        .row-cta {
          grid-column: 3;
          grid-row: 1 / 3;
          align-self: center;
          min-width: 82px;
        }

        .drawer {
          width: 100vw;
        }

        .drawer-head {
          padding: 22px 18px 14px;
        }

        .drawer-head h2 {
          font-size: 24px;
        }

        .drawer-tabs {
          flex-wrap: wrap;
          gap: 8px 18px;
          padding: 0 18px;
          overflow-x: visible;
        }

        .drawer-body {
          padding: 16px 18px 120px;
        }

        .drawer-grid,
        .export-row {
          grid-template-columns: 1fr;
        }

        .drawer-card {
          min-height: auto;
          padding: 12px 14px;
        }

        .drawer-card strong {
          margin-top: 7px;
          font-size: 18px;
        }

        .drawer-card .trust {
          margin-top: 7px !important;
        }

        .check-row {
          min-height: 72px;
          grid-template-columns: 36px minmax(0, 1fr);
          gap: 12px;
          padding: 12px 14px;
        }

        .check-row .open-btn {
          grid-column: 2;
          justify-self: start;
          min-width: 84px;
          margin-top: 4px;
        }

        .drawer-foot {
          display: grid;
          grid-template-columns: 1fr;
          padding: 12px 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app"></div>

          city: "Москва",
          date: "2026-08-20",
          status: "Готово к выгрузке",
          stage: "export",
          owner: "Оператор",
          priority: "P3",
          readiness: 100,
          tone: "teal",
          next: "Открыть выгрузку",
          reason: "один ряд готов к Excel",
          cta: "Открыть",
          tags: ["Готово к выгрузке", "без блокеров", "комплект"],
          blockers: [["Экспорт", "Строка готова к пакету"]],
        },
      ];

      const state = {
        view: "agent",
        tab: "attention",
        query: "",
        drawer: false,
        drawerTab: "overview",
        selectedId: "VF-1024",
        theme: "light",
      };

      const tabsByView = {
        agent: [
          ["attention", "Требуют действия"],
          ["work", "В работе"],
          ["review", "На проверке"],
          ["export", "Готово к выгрузке"],
        ],
        admin: [
          ["review", "На проверке"],
          ["attention", "Исправления получены"],
          ["export", "Готово к выгрузке"],
        ],
        export: [
          ["export", "Пакет экспорта"],
          ["history", "История"],
          ["manual", "Ручная запись"],
        ],
      };

      const icons = {
        menu: '<svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>',
        queue:
          '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9 9-9z"/></svg>',
        plus: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
        admin:
          '<svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M8 8h8M8 16h8"/></svg>',
        export:
          '<svg class="icon" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>',
        search:
          '<svg class="icon" viewBox="0 0 24 24"><path d="m21 21-4.3-4.3M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4z"/></svg>',
      };

      const app = document.getElementById("app");

      function selectedCase() {
        return cases.find((item) => item.id === state.selectedId) || cases[0];
      }

      function render() {
        document.body.classList.toggle("dark", state.theme === "dark");
        app.innerHTML = `
          ${rail()}
          <main class="page">${page()}</main>
          <div class="scrim ${state.drawer ? "show" : ""}" data-close></div>
          ${drawer()}
        `;
        bind();
      }

      function rail() {
        return `
          <aside class="rail" aria-label="Основная навигация">
            <div class="logo">VF</div>
            <button class="rail-btn" aria-label="Меню">${icons.menu}</button>
            <div class="rail-spacer"></div>
            <button class="rail-btn ${state.view === "agent" ? "active" : ""}" aria-label="Мои подачи" data-view="agent">${icons.queue}</button>
            <button class="rail-btn" aria-label="Новая заявка" data-new>${icons.plus}</button>
            <button class="rail-btn ${state.view === "admin" ? "active" : ""}" aria-label="Проверка" data-view="admin">${icons.admin}</button>
            <button class="rail-btn ${state.view === "export" ? "active" : ""}" aria-label="Экспорт" data-view="export">${icons.export}</button>
            <div class="rail-sep"></div>
            <button class="rail-btn" aria-label="Переключить тему" data-theme>${state.theme === "dark" ? "Т" : "С"}</button>
          </aside>
        `;
      }

      function page() {
        if (state.view === "admin")
          return queuePage("Проверка", adminRows(), adminPills(), "Очередь оператора");
        if (state.view === "export") return exportPage();
        return queuePage(
          "Мои подачи",
          agentRows(),
          agentPills(),
          "Приоритетная очередь",
        );
      }

      function agentPills() {
        return `<span class="pill amber"><strong>2</strong> требуют действия</span><span class="pill blue"><strong>2</strong> на проверке</span><span class="pill teal"><strong>3</strong> к выгрузке</span>`;
      }

      function adminPills() {
        return `<span class="pill blue"><strong>1</strong> на проверке</span><span class="pill amber"><strong>1</strong> исправления</span><span class="pill teal"><strong>3</strong> к выгрузке</span>`;
      }

      function pageHead(title, pills) {
        return `
          <header class="page-head">
            <div>
              <h1>${title}</h1>
              <div class="pills">${pills}</div>
            </div>
            <div class="brand">VisaFlow</div>
          </header>
        `;
      }

      function toolbar() {
        const tabs = tabsByView[state.view] || tabsByView.agent;
        return `
          <section class="toolbar" aria-label="Фильтры">
            <div class="tabs">
              ${tabs
                .map(
                  ([key, label]) =>
                    `<button class="tab ${state.tab === key ? "active" : ""}" data-tab="${key}">${label}</button>`,
                )
                .join("")}
            </div>
            <div class="tools">
              <label class="search">${icons.search}<input value="${escapeHtml(state.query)}" placeholder="Поиск по подачам" data-search /></label>
              <span class="chip">Город: все</span>
            </div>
          </section>
        `;
      }

      function queuePage(title, rows, pills, queueTitle) {
        return `
          ${pageHead(title, pills)}
          ${toolbar()}
          <section class="workbench">
            <div class="surface" data-testid="priority-queue">
              <div class="surface-head">
                <div><h2>${queueTitle}</h2><p>${rows.length} в списке · сортировка по следующему действию</p></div>
                <span class="chip">${selectedCase().next}</span>
              </div>
              ${queue(rows)}
            </div>
            ${focusPanel(selectedCase())}
          </section>
        `;
      }

      function agentRows() {
        return cases.filter((item) => {
          const stageMatch =
            state.tab === "attention"
              ? item.stage === "attention"
              : state.tab === "work"
                ? item.status === "В работе"
                : item.stage === state.tab;
          return stageMatch && queryMatch(item);
        });
      }

      function adminRows() {
        return cases.filter((item) => {
          const stageMatch =
            state.tab === "review"
              ? item.stage === "review"
              : state.tab === "attention"
                ? item.status === "Возвращено"
                : item.stage === "export";
          return stageMatch && queryMatch(item);
        });
      }

      function queryMatch(item) {
        const query = state.query.trim().toLowerCase();
        if (!query) return true;
        return `${item.id} ${item.title} ${item.city} ${item.status} ${item.next}`
          .toLowerCase()
          .includes(query);
      }

      function queue(rows) {
        return `
          <div class="queue">
            <div class="queue-head">
              <span>Приоритет</span><span>Заявка</span><span>Следующее действие</span><span>Готовность</span><span></span>
            </div>
            ${
              rows.length
                ? rows.map((item, index) => queueRow(item, index + 1)).join("")
                : '<div class="queue-row"><span></span><span><strong class="row-title">Нет заявок в этом фильтре</strong><span class="row-meta">Измените фильтр или поиск.</span></span></div>'
            }
          </div>
        `;
      }

      function queueRow(item, rank) {
        const active = item.id === state.selectedId;
        return `
          <button class="queue-row ${active ? "active" : ""}" data-select="${item.id}" data-testid="case-${item.id}">
            <span class="rank">${rank}</span>
            <span>
              <strong class="row-title">${item.title}</strong>
              <span class="row-meta">${item.type} · ${item.city} · ${item.date}</span>
              <span class="row-tags">${item.tags.map((tag) => `<span class="tag ${tagTone(tag)}">${tag}</span>`).join("")}</span>
            </span>
            <span><strong class="next-action">${item.next}</strong><span class="reason">${item.reason}</span></span>
            <span class="readiness"><strong>${item.readiness}%</strong><span class="meter"><span style="width: ${item.readiness}%"></span></span></span>
            <span class="row-cta">Открыть</span>
          </button>
        `;
      }

      function tagTone(tag) {
        if (tag.includes("Возвращ") || tag.includes("блок")) return "red";
        if (tag.includes("провер")) return "blue";
        if (tag.includes("готов") || tag.includes("без")) return "teal";
        return "amber";
      }

      function focusPanel(item) {
        return `
          <aside class="focus-panel" data-testid="focus-panel">
            <div class="focus-head">
              <h2>Активная заявка</h2>
              <p>${item.id} · ${item.title}</p>
              <div class="drawer-tags" style="margin-top: 12px">${item.tags.map((tag) => `<span class="tag ${tagTone(tag)}">${tag}</span>`).join("")}</div>
            </div>
            <div class="focus-action">
              <span class="hint">Главное следующее действие</span>
              <strong>${item.next}</strong>
              <p class="trust" style="margin-top: 8px">${item.reason}</p>
            </div>
            <div class="focus-list">
              ${item.blockers
                .map(
                  ([title, text], index) => `
                    <div class="focus-item">
                      <span class="focus-dot ${index === 0 && item.blockers.length > 1 ? "red" : ""}"></span>
                      <span><strong>${title}</strong><span>${text}</span></span>
                    </div>
                  `,
                )
                .join("")}
            </div>
            <div class="focus-footer">
              <button class="btn primary" data-open-selected>Открыть рабочую панель</button>
              <button class="btn ghost" data-view="export">К экспорту</button>
              <p class="trust">AI подсказывает порядок работы. Решение и финальную проверку выполняет человек.</p>
            </div>
          </aside>
        `;
      }

      function exportPage() {
        const rows = [
          ["1", "Елена Петрова", "VF-1024 · семья Петровых", "готово"],
          ["2", "Алексей Петров", "VF-1024 · семья Петровых", "готово"],
          ["3", "Мария Петрова", "VF-1024 · семья Петровых", "ожидает"],
          ["4", "Ольга Орлова", "VF-1041 · один заявитель", "готово"],
        ];
        return `
          ${pageHead("Экспорт", '<span class="pill teal"><strong>6</strong> заявок готовы</span><span class="pill blue"><strong>21</strong> заявитель</span><span class="pill amber"><strong>5</strong> семей</span>')}
          ${toolbar()}
          <section class="export-grid">
            <div class="surface" data-testid="export-preview">
              <div class="surface-head">
                <div><h2>Пакет экспорта</h2><p>Один ряд - один заявитель. Семьи сохраняются рядом.</p></div>
                <button class="btn primary">Сформировать Excel</button>
              </div>
              ${rows
                .map(
                  ([n, name, meta, status]) => `
                    <div class="export-row">
                      <strong>${n}</strong><strong>${name}</strong><span class="muted">${meta}</span><span class="tag ${status === "готово" ? "teal" : "amber"}">${status}</span>
                    </div>
                  `,
                )
                .join("")}
            </div>
            <aside class="focus-panel">
              <div class="focus-head"><h2>Передача на запись</h2></div>
              <div class="focus-action"><strong>Ручной appointment handoff</strong><p class="trust" style="margin-top: 8px">Система готовит пакет, но не создает запись автоматически и не обещает визовый исход.</p></div>
              <div class="focus-footer"><button class="btn primary">Обновить статус</button></div>
            </aside>
          </section>
        `;
      }

      function drawer() {
        const item = selectedCase();
        return `
          <aside class="drawer ${state.drawer ? "open" : ""}" aria-label="Детали заявки" data-testid="case-drawer">
            <header class="drawer-head">
              <div>
                <h2>${item.title}</h2>
                <div class="drawer-tags">
                  <span class="tag amber">${item.city}</span>
                  <span class="tag">${item.type}</span>
                  <span class="tag ${tagTone(item.status)}">${item.status}</span>
                </div>
              </div>
              <button class="icon-btn" data-close aria-label="Закрыть">×</button>
            </header>
            <nav class="drawer-tabs" aria-label="Разделы заявки">
              ${[
                ["overview", "Обзор"],
                ["people", "Люди"],
                ["form", "Анкета"],
                ["files", "Файлы"],
                ["notes", "Замечания"],
                ["history", "История"],
              ]
                .map(
                  ([key, label]) =>
                    `<button class="tab ${state.drawerTab === key ? "active" : ""}" data-drawer-tab="${key}">${label}</button>`,
                )
                .join("")}
            </nav>
            <section class="drawer-body">${drawerContent(item)}</section>
            <footer class="drawer-foot">
              <button class="btn ghost" data-close>Закрыть</button>
              <button class="btn primary">Отправить исправления</button>
              <button class="btn ghost">Заполнить недостающее</button>
            </footer>
          </aside>
        `;
      }

      function drawerContent(item) {
        if (state.drawerTab === "people") {
          return checklist([
            ["teal", "Елена Петрова", "Фото требует замены", "Открыть"],
            ["teal", "Алексей Петров", "Анкета готова", "Открыть"],
            ["amber", "Мария Петрова", "Нужно заполнить номер паспорта", "Открыть"],
          ]);
        }
        if (state.drawerTab === "form") {
          return `
            <div class="drawer-grid">
              ${infoCard("Личные данные", "Готово", "Сохранено 2 минуты назад")}
              ${infoCard("Паспорт", "1 пропуск", "Номер паспорта Марии")}
              ${infoCard("Поездка", "Готово", `${item.city} · ${item.date}`)}
            </div>
          `;
        }
        if (state.drawerTab === "files") {
          return checklist([
            [
              "red",
              "Стандартное фото",
              "Требуется замена: фон недостаточно светлый",
              "Заменить",
            ],
            ["teal", "Селфи", "Загружено, ждет проверки оператора", "Открыть"],
            ["amber", "Видео", "Нужно загрузить файл около 1 минуты", "Загрузить"],
          ]);
        }
        if (state.drawerTab === "notes") {
          return checklist(
            item.blockers.map(([title, text]) => ["red", title, text, "Исправить"]),
          );
        }
        if (state.drawerTab === "history") {
          return checklist([
            ["teal", "Заявка создана", "Агент добавил подачу", ""],
            ["blue", "Отправлена на проверку", "Оператор начал human review", ""],
            ["red", item.status, item.reason, ""],
          ]);
        }
        return `
          <div class="drawer-grid">
            ${infoCard("Статус", item.status, item.next)}
            ${infoCard("Группа", item.city, `${item.date} · обычная`)}
            ${infoCard("Готовность", `${item.readiness}%`, item.reason)}
          </div>
          ${checklist(item.blockers.map(([title, text], index) => [index === 0 ? "red" : "amber", title, text, "Открыть"]))}
          <p class="trust">AI подсказывает следующий шаг. Финальную проверку выполняет человек; система не обещает визу и не имитирует официальную проверку.</p>
        `;
      }

      function infoCard(label, value, help) {
        return `<article class="drawer-card"><h3>${label}</h3><strong>${value}</strong><p class="trust" style="margin-top: 10px">${help}</p></article>`;
      }

      function checklist(rows) {
        return `
          <div class="checklist">
            ${rows
              .map(
                ([tone, title, text, action]) => `
                  <div class="check-row">
                    <span class="tag ${tone}">${tone === "teal" ? "✓" : "!"}</span>
                    <span><strong>${title}</strong><span class="muted">${text}</span></span>
                    ${action ? `<button class="open-btn">${action}</button>` : ""}
                  </div>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function bind() {
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.addEventListener("click", () => {
            state.view = button.dataset.view;
            state.tab =
              state.view === "admin"
                ? "review"
                : state.view === "export"
                  ? "export"
                  : "attention";
            state.drawer = false;
            render();
          });
        });
        document.querySelectorAll("[data-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            state.tab = button.dataset.tab;
            render();
          });
        });
        document.querySelector("[data-search]")?.addEventListener("input", (event) => {
          state.query = event.target.value;
          render();
          document.querySelector("[data-search]")?.focus();
        });
        document.querySelectorAll("[data-select]").forEach((button) => {
          button.addEventListener("click", () => {
            state.selectedId = button.dataset.select;
            state.drawer = true;
            state.drawerTab = "overview";
            render();
          });
        });
        document
          .querySelector("[data-open-selected]")
          ?.addEventListener("click", () => {
            state.drawer = true;
            state.drawerTab = "overview";
            render();
          });
        document.querySelector("[data-new]")?.addEventListener("click", () => {
          state.selectedId = "VF-1024";
          state.drawer = true;
          state.drawerTab = "overview";
          render();
        });
        document.querySelectorAll("[data-drawer-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            state.drawerTab = button.dataset.drawerTab;
            render();
          });
        });
        document.querySelectorAll("[data-close]").forEach((button) => {
          button.addEventListener("click", () => {
            state.drawer = false;
            render();
          });
        });
        document.querySelector("[data-theme]")?.addEventListener("click", () => {
          state.theme = state.theme === "dark" ? "light" : "dark";
          render();
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.drawer) {
          state.drawer = false;
          render();
        }
      });

      render();
    </script>
  </body>
</html>
