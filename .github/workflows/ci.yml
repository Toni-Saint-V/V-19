name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Safety verifier
        run: npm run verify:safety

      - name: Boundary verifier
        run: npm run verify:v19-boundary

      - name: Supabase release contract
        run: npm run verify:supabase-release

      - name: Agent screen runtime contract
        run: npm run verify:agent-screen-runtime

      - name: Security audit
        run: npm run verify:security
